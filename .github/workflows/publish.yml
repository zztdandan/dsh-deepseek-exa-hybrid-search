name: Release

# A `v*` tag publishes the package to npm (with provenance) and creates the
# GitHub Release with the same prebuilt tarball attached. Storefronts
# (awesome-dsh-plugin and everything built on it) install from npm.
#
#   npm version patch --no-git-tag-version && git commit -am "chore: release"
#   git tag v1.1.4 && git push --follow-tags
#
# `workflow_dispatch` with publish=true publishes the version in package.json
# without a tag, for re-runs and backfills.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package.json version to npm (skipped when it already exists)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Package contract (dsh.bundle, locale, icon, engines.dsh)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: node scripts/check-release-tag.mjs

      - name: Build the published tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # A version-free copy keeps releases/latest/download/<name>.tgz stable
          cp "dist/$name-$version.tgz" "dist/$name.tgz"
          ls -l dist

      - name: Publish to npm (skipped when the version already exists)
        if: github.event_name == 'push' || inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
          else
            npm publish --provenance --access public
          fi

      - name: GitHub Release with the prebuilt tarball
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
