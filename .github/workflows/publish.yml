name: Release

# Git is the distribution channel: a tag produces a GitHub Release with the
# prebuilt tarball attached. Nothing is published to npm.
#
#   git tag v1.1.3 && git push --follow-tags
#
# Storefronts (awesome-dsh-plugin and everything built on it) install from this
# repository, so a new tag is all they need.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package contract (dsh.bundle, locale, icon, engines.dsh)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: node scripts/check-release-tag.mjs

      - name: Build the published tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # A version-free copy keeps releases/latest/download/<name>.tgz stable
          cp "dist/$name-$version.tgz" "dist/$name.tgz"
          ls -l dist

      - name: GitHub Release with the prebuilt tarball
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
